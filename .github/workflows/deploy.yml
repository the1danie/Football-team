# CI/CD: пуш в рабочую ветку или в любую ветку Claude (claude/...) → тесты → выкладка на сервер.
# Ветку Claude workflow сам вливает в рабочую — ничего запускать с компьютера не нужно.
# Настройка один раз — deploy/README.md, раздел «Автообновление (CI/CD)».
name: Тесты и выкладка на сервер

on:
  push:
    branches: ['claude/**']
  pull_request:
  workflow_dispatch:

env:
  PROD_BRANCH: claude/telegram-duty-bot

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  # Ветка Claude → вливаем в рабочую. Если рабочая ушла вперёд — делаем merge и прогоняем тесты ещё раз.
  promote:
    needs: test
    if: github.event_name == 'push' && github.ref_name != 'claude/telegram-duty-bot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Влить в рабочую ветку
        env:
          SRC: ${{ github.sha }}
          SRC_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Несколько попыток: параллельно может вливаться другая ветка.
          for attempt in 1 2 3; do
            git fetch -q origin "$PROD_BRANCH"
            git checkout -q -B "$PROD_BRANCH" "origin/$PROD_BRANCH"
            if git merge-base --is-ancestor "$SRC" HEAD; then
              echo "Изменения уже в $PROD_BRANCH"; exit 0
            fi
            if ! git merge --ff-only -q "$SRC" 2>/dev/null; then
              git merge --no-edit -m "Влить $SRC_NAME в $PROD_BRANCH" "$SRC" || {
                git merge --abort
                echo "::error::Конфликт при слиянии $SRC_NAME в $PROD_BRANCH — нужно решить вручную"; exit 1; }
              python -m pytest -q   # проверяем то, что реально уедет на сервер
            fi
            git push origin "HEAD:$PROD_BRANCH" && exit 0
            echo "Рабочая ветка изменилась, пробую ещё раз ($attempt)…"; sleep 5
          done
          echo "::error::Не удалось запушить в $PROD_BRANCH"; exit 1

  deploy:
    needs: [test, promote]
    # Пуш в рабочую ветку (promote пропущен) или успешно влитая ветка Claude.
    if: >-
      always() && github.event_name != 'pull_request'
      && needs.test.result == 'success'
      && (needs.promote.result == 'success'
          || (needs.promote.result == 'skipped' && github.ref_name == 'claude/telegram-duty-bot'))
    runs-on: ubuntu-latest
    environment: production
    # Одна выкладка за раз на весь репозиторий; update.sh всё равно берёт свежую рабочую ветку.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Обновить бота на сервере
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$HOST" \
            || { echo "::error::Нет секретов DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS / DEPLOY_HOST — см. deploy/README.md"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # На сервере ключ привязан к одной команде (обновить бота), что бы ни передали здесь.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "deploy@$HOST"
